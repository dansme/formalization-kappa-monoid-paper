name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Free disk space before lean-action: its `lake exe cache get` unpacks several GB of
      # Mathlib oleans, and the API docs (below) add several more.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /

      - uses: leanprover/lean-action@v1

      # `declaration uses `sorry`` is only a warning, so `lake build` stays green on a
      # `sorry` in an imported file.  The root target must be sorry-free at every commit, so
      # check for it explicitly.  This is a cached replay of the build above, not a rebuild.
      # Every file of the development, §§2-5, is part of the root target.
      - name: The root target is sorry-free
        run: |
          set -o pipefail
          lake build KappaMonoid 2>&1 | tee build.log
          if grep -q 'declaration uses .sorry' build.log; then
            echo "::error::the root target is not sorry-free"
            grep 'declaration uses .sorry' build.log
            exit 1
          fi

      # The layering is a claim about imports, and Lake will not enforce it: it resolves
      # modules package-wide, so `Core/` importing `Modules/` would build fine.  This is what
      # keeps the lower layers reusable — monoid theory with no module theory and no axioms.
      - name: The layering holds
        run: ./scripts/check_layering.sh

      # No axioms.  The development declares none (the Bergman–Dicks realisation theorem, once
      # assumed, is proved in `KappaMonoid/Bergman/`); a deliberate addition means asking first,
      # then editing this list and `README.md` in the same commit.
      - name: The axiom list has not changed
        run: |
          : > axioms.expected
          # ask Lean, not grep: every `axiom` constant declared in a KappaMonoid module, however
          # it is written (namespaced, private, indented, or produced by a macro)
          set -o pipefail
          lake env lean scripts/list_axioms.lean | sort > axioms.actual
          if ! diff -u axioms.expected axioms.actual; then
            echo "::error::the set of axiom declarations under KappaMonoid/ has changed"
            exit 1
          fi
